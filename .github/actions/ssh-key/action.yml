name: ssh-key
description: >
  Load an SSH deploy key into an ssh-agent for the job and export SSH_DOCKER_ARGS
  (docker run arguments which forward the agent).  Call again with cleanup: 'true'
  once the key is no longer needed.  Remove the use of this action entirely to
  build with https on public repositories: SSH_DOCKER_ARGS is then simply unset.
inputs:
  ssh-private-key:
    description: Private key (including BEGIN/END lines), normally secrets.SSH_PRIVATE_KEY
    required: false
    default: ''
  cleanup:
    description: "'true' to remove the key and everything set up for it"
    required: false
    default: 'false'
  debug:
    description: "'true' to print ssh/git state before and after cleaning up stale key state"
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # webfactory/ssh-agent leaves files in the real $HOME on a self hosted runner,
    # remove anything left by a previous job before and after using the key.
    - name: Remove ssh deploy key state
      shell: bash
      run: |
        [[ "${{ inputs.cleanup }}" == "true" ]] && ssh-add -D || true
        "${GITHUB_ACTION_PATH}/cleanup-ssh-keys.sh" ${{ inputs.debug == 'true' && 'debug' || '' }}
    # webfactory/ssh-agent fails the job on an empty key, e.g. SSH_PRIVATE_KEY secret
    # not defined or a run without access to secrets, so skip it and build without ssh
    - name: Add ssh key to agent
      if: inputs.cleanup != 'true' && inputs.ssh-private-key != ''
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
    - name: Export docker arguments
      if: inputs.cleanup != 'true' && inputs.ssh-private-key != ''
      shell: bash
      run: |
        # An env file avoids quoting problems with the spaces in GIT_SSH_COMMAND
        env_file="${RUNNER_TEMP}/ssh-key-docker.env"
        {
          echo "SSH_AUTH_SOCK=/ssh-agent"
          echo "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no"
        } > "${env_file}"
        echo "SSH_DOCKER_ARGS=-v ${SSH_AUTH_SOCK}:/ssh-agent --env-file ${env_file}" >> "$GITHUB_ENV"
    - name: Unset docker arguments
      if: inputs.cleanup == 'true'
      shell: bash
      run: |
        rm -f "${RUNNER_TEMP}/ssh-key-docker.env"
        echo "SSH_DOCKER_ARGS=" >> "$GITHUB_ENV"
